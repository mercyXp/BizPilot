services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bizpilot
      POSTGRES_PASSWORD: bizpilot
      POSTGRES_DB: bizpilot
    ports:
      - "55432:5432"
    volumes:
      - bizpilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizpilot -d bizpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  bizpilot_pg:
