# BizPilot API + Postgres + Redis on Render.
# Dashboard: New + Blueprint → this repo. Region is immutable after create.
# https://dashboard.render.com/blueprints

databases:
  - name: bizpilot-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: bizpilot
    user: bizpilot
    diskSizeGB: 5
    ipAllowList: []

services:
  - type: keyvalue
    name: bizpilot-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: bizpilot-api
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -e .
    preDeployCommand: python -m app.ops.release
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: BizPilot
      - key: DEMO_ENABLED
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: BIZPILOT_APP_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bizpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bizpilot-redis
          type: keyvalue
          property: connectionString
      - key: PUBLIC_APP_URL
        value: https://bizpilotfrontend.vercel.app
      - key: CORS_ORIGINS
        value: https://bizpilotfrontend.vercel.app,https://bizpilotfrontend-mercy30s-projects.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
